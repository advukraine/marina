<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>&#9825;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #c {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #000;
    z-index: 0;
  }

  /* экран старта */
  #tap {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 300 clamp(15px, 3.4vmin, 26px)/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: #7fd4ff;
    text-shadow: 0 0 18px rgba(77, 166, 255, 0.55);
    animation: breathe 2.8s ease-in-out infinite;
    transition: opacity 0.7s ease;
    cursor: pointer;
  }
  #tap.gone { opacity: 0 !important; pointer-events: none; animation: none; }
  @keyframes breathe {
    0%, 100% { opacity: 0.22; }
    50%      { opacity: 0.78; }
  }

  /* счётчик */
  #counter {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2vmin);
    z-index: 2;
    font: 400 clamp(11px, 2.5vmin, 19px)/1 ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
    letter-spacing: 0.12em;
    white-space: nowrap;
    color: #7fd4ff;
    text-shadow: 0 0 12px rgba(77, 166, 255, 0.45);
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }
  #counter.on { opacity: 0.5; }

  /* плеер в углу */
  #music {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 2.5vmin);
    right: calc(env(safe-area-inset-right, 0px) + 2.5vmin);
    z-index: 3;
    width: clamp(104px, 30vmin, 200px);
    height: clamp(104px, 30vmin, 200px);
    border-radius: 12px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #music:not(.ready) { pointer-events: none; }
  #music.ready { opacity: 0.15; }
  #music.ready:hover, #music.ready.awake { opacity: 1; }
  #music iframe { display: block; width: 100%; height: 100%; border: 0; }
  /* прозрачная плёнка: первое касание «будит» плеер, дальше тап проходит внутрь */
  #scrim { position: absolute; inset: 0; }
  #music.awake #scrim, #music.no-scrim #scrim { pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="counter"></div>
<div id="music"><div id="yt"></div><div id="scrim"></div></div>
<div id="tap">нажми</div>
<script>
(function () {
  'use strict';

  /* ================= НАСТРОЙКИ ================= */

  // слова, из которых собирается сердце (регистр подставляется случайно)
  const WORDS = ["Мари", "Марина", "люблю тебя", "love you", "моя", "навсегда"];

  // дата, от которой считается счётчик внизу экрана
  const START_DATE = new Date("2026-04-01");

  // id ролика на YouTube для фоновой музыки
  const YT_ID = "SHAhGCAYxFU";

  // имя, которое проявляется в центре сердца
  const NAME = "Марина";

  const MUSIC_VOLUME = 35;      // громкость музыки, 0–100
  const ASSEMBLE_MS = 2500;     // сколько собирается сердце
  const NAME_DELAY_MS = 6000;   // когда появляются имя и счётчик
  const NAME_FADE_MS = 2200;    // длительность их проявления
  const BEAT_MS = 1000;         // один удар сердца (1000 мс = 60 уд/мин)
  const BEAT_AMP = 0.08;        // насколько сердце увеличивается на ударе
  const BURST_MS = 1000;        // за сколько частицы возвращаются после тапа

  const COLORS = ['#4da6ff', '#7fd4ff', '#bde7ff'];

  // размеры надписей заданы долей от ширины сердца — поэтому масштабируются с экраном
  const SIZE_EDGE = [0.026, 0.042];   // по контуру
  const SIZE_IN   = [0.033, 0.058];   // внутри
  const NAME_SIZE = 0.16;             // размер имени относительно ширины сердца

  const MIN_PARTICLES = 200;    // телефон
  const MAX_PARTICLES = 350;    // широкий десктоп

  /* ============== ДАЛЬШЕ МОЖНО НЕ СМОТРЕТЬ ============== */

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var measure = document.createElement('canvas').getContext('2d');
  var tapEl = document.getElementById('tap');
  var counterEl = document.getElementById('counter');
  var musicEl = document.getElementById('music');
  var scrimEl = document.getElementById('scrim');

  var W = 0, H = 0, DPR = 1;
  var scale = 1, cx = 0, cy = 0;
  var spriteScale = 0, spriteDpr = 0;

  var started = false;
  var startTime = 0;
  var lastFrame = 0;
  var particles = [];
  var escapeTimer = 0;
  var flash = 0;
  var lastSecond = -1;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function monoFont(size) {
    return size.toFixed(1) + 'px ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace';
  }

  // случайное слово в случайном регистре
  function styledWord() {
    var w = pick(WORDS);
    var r = Math.random();
    if (r < 0.36) return w.toLowerCase();
    if (r < 0.70) return w.toUpperCase();
    return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  }

  /* ---------- форма сердца (параметрическое уравнение) ---------- */
  // x = 16 sin^3 t ; y = 13 cos t - 5 cos 2t - 2 cos 3t - cos 4t
  function heartPoint(t) {
    var s = Math.sin(t);
    return {
      x: 16 * s * s * s,
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    };
  }

  // реальные границы фигуры считаем численно (y: примерно -17 .. 11.8)
  var HEART_MID_Y = 0, HEART_SPAN_Y = 29, HEART_SPAN_X = 32;
  (function () {
    var minY = Infinity, maxY = -Infinity, maxX = 0;
    for (var i = 0; i <= 2000; i++) {
      var q = heartPoint((i / 2000) * Math.PI * 2);
      if (q.y < minY) minY = q.y;
      if (q.y > maxY) maxY = q.y;
      if (Math.abs(q.x) > maxX) maxX = Math.abs(q.x);
    }
    HEART_MID_Y = (minY + maxY) / 2;
    HEART_SPAN_Y = maxY - minY;
    HEART_SPAN_X = maxX * 2;
  })();

  // равномерное распределение по длине контура (иначе точки сбиваются в комки)
  var ARC = (function () {
    var N = 2000, ts = [], len = [0], total = 0, prev = heartPoint(0);
    for (var i = 0; i <= N; i++) {
      var t = (i / N) * Math.PI * 2;
      var q = heartPoint(t);
      total += Math.hypot(q.x - prev.x, q.y - prev.y);
      ts.push(t); len.push(total);
      prev = q;
    }
    return { t: ts, len: len, total: total };
  })();

  function tAtArc(u) { // u: 0..1 доля длины контура
    u = u - Math.floor(u);
    var target = u * ARC.total, lo = 0, hi = ARC.t.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (ARC.len[mid] < target) lo = mid + 1; else hi = mid;
    }
    return ARC.t[lo];
  }

  /* ---------- частицы ---------- */
  function particleCount() {
    var d = Math.sqrt(W * H);
    var k = (d - 570) / (1140 - 570); // телефон -> десктоп
    k = Math.max(0, Math.min(1, k));
    return Math.round(MIN_PARTICLES + (MAX_PARTICLES - MIN_PARTICLES) * k);
  }

  function buildParticles() {
    var n = particleCount();
    var contour = Math.round(n * 0.68);
    var list = [];

    for (var i = 0; i < n; i++) {
      var t = (i < contour)
        ? tAtArc((i + rand(-0.30, 0.30)) / contour)
        : tAtArc(Math.random());

      var q = heartPoint(t);
      var hx = q.x, hy = q.y;
      var inside = i >= contour;

      if (inside) {
        // немного внутри контура — сжатие к центру фигуры
        var k = 0.22 + Math.sqrt(Math.random()) * 0.60;
        hx = q.x * k;
        hy = (q.y - HEART_MID_Y) * k + HEART_MID_Y;
      }

      var p = {
        hx: hx,
        hy: hy,
        inside: inside,
        text: styledWord(),
        sizeK: inside ? rand(SIZE_IN[0], SIZE_IN[1]) : rand(SIZE_EDGE[0], SIZE_EDGE[1]),
        color: pick(COLORS),
        alpha: inside ? rand(0.3, 0.72) : rand(0.55, 1.0),
        // мерцание и дрожание
        twPhase: rand(0, Math.PI * 2),
        twSpeed: rand(0.6, 2.0),
        jxPhase: rand(0, Math.PI * 2),
        jyPhase: rand(0, Math.PI * 2),
        jxSpeed: rand(0.5, 1.5),
        jySpeed: rand(0.5, 1.5),
        jAmp: rand(0.6, 2.2),
        // состояние: fly -> settled -> escape -> fly
        state: 'fly',
        t0: 0,
        dur: ASSEMBLE_MS,
        delay: Math.random() * 550,
        sx: 0, sy: 0,      // точка старта
        ex: 0, ey: 0,      // позиция при отлёте
        evx: 0, evy: 0,
        efade: 1,
        ox: 0, oy: 0,      // отклонение от тапа
        ovx: 0, ovy: 0,
        x: 0, y: 0,
        px: 12,
        sprite: null, sw: 0, sh: 0
      };
      spawnFrom(p);
      list.push(p);
    }
    particles = list;
  }

  function spawnFrom(p) {
    p.sx = rand(-0.1, 1.1) * W;
    p.sy = rand(-0.1, 1.1) * H;
  }

  function refreshWord(p) {
    p.text = styledWord();
    p.color = pick(COLORS);
    p.sizeK = p.inside ? rand(SIZE_IN[0], SIZE_IN[1]) : rand(SIZE_EDGE[0], SIZE_EDGE[1]);
    p.alpha = p.inside ? rand(0.3, 0.72) : rand(0.55, 1.0);
    makeSprite(p);
  }

  /* ---------- спрайты: текст со свечением рисуется один раз ---------- */
  // длинные слова чуть мельче — иначе контур сердца размывается
  function lenFactor(text) {
    return Math.max(0.62, Math.min(1, 7 / text.length));
  }

  function makeSprite(p) {
    p.px = Math.max(6, p.sizeK * HEART_SPAN_X * scale * lenFactor(p.text));
    var font = monoFont(p.px);
    measure.font = font;
    var tw = Math.max(1, measure.measureText(p.text).width);
    var blur = p.px * 0.85;
    var pad = Math.ceil(blur * 1.25 + 4); // рамка под свечение — меньше рамка, меньше заливки в кадре

    var cw = Math.ceil(tw) + pad * 2;
    var ch = Math.ceil(p.px * 1.7) + pad * 2;

    var off = document.createElement('canvas');
    off.width = Math.max(1, Math.ceil(cw * DPR));
    off.height = Math.max(1, Math.ceil(ch * DPR));
    var g = off.getContext('2d');
    g.scale(DPR, DPR);
    g.font = font;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = p.color;
    g.shadowColor = p.color;
    g.shadowBlur = blur;
    g.fillText(p.text, pad, ch / 2);
    g.shadowBlur = blur * 0.5;
    g.fillText(p.text, pad, ch / 2);

    p.sprite = off;
    p.sw = cw;
    p.sh = ch;
  }

  function buildSprites() {
    for (var i = 0; i < particles.length; i++) makeSprite(particles[i]);
    spriteScale = scale;
    spriteDpr = DPR;
  }

  /* ---------- размеры / ретина / адаптивность ---------- */
  function resize() {
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // поля: по бокам под ширину самих надписей, снизу под счётчик
    var padX = Math.max(26, Math.min(W, H) * 0.11);
    var padTop = Math.max(22, H * 0.06);
    var padBottom = Math.max(52, H * 0.12);

    var fitW = (W - padX * 2) / HEART_SPAN_X;
    var fitH = (H - padTop - padBottom) / HEART_SPAN_Y;
    var target = (Math.min(W, H) * 0.74) / HEART_SPAN_Y; // ~70% меньшей стороны

    scale = Math.max(3, Math.min(fitW, fitH, target));
    cx = W / 2;
    cy = padTop + (H - padTop - padBottom) / 2;

    nameSprite = null;
  }

  function heartToScreen(p, k, out) {
    out.x = cx + p.hx * scale * k;
    out.y = cy - (p.hy - HEART_MID_Y) * scale * k;
  }

  /* ---------- биение сердца ---------- */
  function beat(phase) {
    var a = Math.exp(-Math.pow((phase - 0.13) / 0.085, 2));
    var b = 0.55 * Math.exp(-Math.pow((phase - 0.35) / 0.10, 2));
    return Math.min(1, a + b);
  }

  /* ---------- надпись с именем ---------- */
  var nameSprite = null, nameW = 0, nameH = 0, nameSize = 40;

  function buildNameSprite() {
    var size = HEART_SPAN_X * scale * NAME_SIZE;
    var font = function (px) {
      return '600 ' + px.toFixed(1) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    };
    // вписываем имя внутрь сердца
    measure.font = font(size);
    var maxW = Math.min(W * 0.62, HEART_SPAN_X * scale * 0.60);
    var tw = measure.measureText(NAME).width;
    if (tw > maxW) { size *= maxW / tw; measure.font = font(size); tw = measure.measureText(NAME).width; }

    var blur = size * 0.75;
    var pad = Math.ceil(blur * 2.2);
    var cw = Math.ceil(tw) + pad * 2;
    var ch = Math.ceil(size * 1.6) + pad * 2;

    var off = document.createElement('canvas');
    off.width = Math.max(1, Math.ceil(cw * DPR));
    off.height = Math.max(1, Math.ceil(ch * DPR));
    var g = off.getContext('2d');
    g.scale(DPR, DPR);
    g.font = font(size);
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    // мягкое свечение несколькими проходами
    g.shadowColor = '#4da6ff';
    g.shadowBlur = blur;
    g.fillStyle = '#7fd4ff';
    g.fillText(NAME, cw / 2, ch / 2);
    g.shadowColor = '#7fd4ff';
    g.shadowBlur = blur * 0.45;
    g.fillText(NAME, cw / 2, ch / 2);
    g.shadowBlur = blur * 0.2;
    g.fillStyle = '#eaf7ff';
    g.fillText(NAME, cw / 2, ch / 2);

    nameSprite = off;
    nameW = cw;
    nameH = ch;
    nameSize = size;
  }

  function drawName(now) {
    var age = now - NAME_DELAY_MS;
    if (age <= 0) return;
    if (!nameSprite) buildNameSprite();

    var k = Math.min(1, age / NAME_FADE_MS);
    var e = 1 - Math.pow(1 - k, 3);
    var breathe = 1 + 0.015 * Math.sin(now / 900);
    var sc = (0.86 + 0.14 * e) * breathe;
    var ny = cy - scale * 0.8;
    var size = nameSize;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    // мягко притеняем надписи под именем, чтобы оно читалось
    var rg = ctx.createRadialGradient(cx, ny, 0, cx, ny, size * 2.6);
    rg.addColorStop(0, 'rgba(0,0,0,' + (0.62 * e).toFixed(3) + ')');
    rg.addColorStop(0.55, 'rgba(0,0,0,' + (0.38 * e).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(cx - size * 2.8, ny - size * 2.8, size * 5.6, size * 5.6);

    ctx.globalAlpha = e;
    ctx.translate(cx, ny);
    ctx.scale(sc, sc);
    ctx.drawImage(nameSprite, -nameW / 2, -nameH / 2, nameW, nameH);
    ctx.restore();
  }

  /* ---------- счётчик ---------- */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function daysWord(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'день';
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'дня';
    return 'дней';
  }
  function updateCounter() {
    var diff = Date.now() - START_DATE.getTime();
    if (!isFinite(diff) || diff < 0) diff = 0;
    var total = Math.floor(diff / 1000);
    var days = Math.floor(total / 86400);
    var rest = total % 86400;
    var d = String(days);
    while (d.length < 3) d = '0' + d;
    counterEl.textContent = 'вместе ' + d + ' ' + daysWord(days) + ' ' +
      pad2(Math.floor(rest / 3600)) + ':' + pad2(Math.floor((rest % 3600) / 60)) + ':' + pad2(rest % 60);
  }

  /* ---------- отрыв надписей и возврат новых ---------- */
  function releaseOne() {
    var tries = 12;
    while (tries--) {
      var p = particles[(Math.random() * particles.length) | 0];
      if (p.state === 'settled') {
        p.state = 'escape';
        p.ex = p.x - p.ox;
        p.ey = p.y - p.oy;
        p.evx = rand(-14, 14);
        p.evy = rand(-34, -16);
        p.efade = 1;
        return;
      }
    }
  }

  /* ---------- вспышка от касания ---------- */
  function burst(px, py) {
    flash = 1;
    var R = HEART_SPAN_X * scale * 0.42;
    var power = HEART_SPAN_X * scale * 3.0; // импульс пропорционален размеру сердца
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - px, dy = p.y - py;
      var d = Math.hypot(dx, dy);
      if (d < 0.001) { dx = rand(-1, 1); dy = rand(-1, 1); d = Math.hypot(dx, dy); }
      var f = power * (R / (d + R)) * rand(0.75, 1.25);
      p.ovx += (dx / d) * f;
      p.ovy += (dy / d) * f;
    }
  }

  /* ---------- кадр ---------- */
  // пружина возврата после тапа: за BURST_MS частицы садятся обратно
  var SPRING_W = 5.7 * (1000 / BURST_MS);
  var SPRING_K = SPRING_W * SPRING_W;
  var SPRING_C = 2 * 0.7 * SPRING_W;

  var tmp = { x: 0, y: 0 };

  function frame(ts) {
    if (!lastFrame) lastFrame = ts;
    var dt = Math.min(64, ts - lastFrame);
    lastFrame = ts;
    var now = ts - startTime;
    var sec = now / 1000;
    var dts = dt / 1000;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    flash = Math.max(0, flash - dts / 0.55);

    var assembled = now > ASSEMBLE_MS * 0.9;
    var pulse = assembled ? 1 + BEAT_AMP * beat(((now - ASSEMBLE_MS * 0.9) % BEAT_MS) / BEAT_MS) : 1;
    pulse *= 1 + 0.05 * flash;

    // периодический отрыв надписей
    if (now > ASSEMBLE_MS) {
      escapeTimer -= dt;
      if (escapeTimer <= 0) {
        escapeTimer = rand(280, 620);
        releaseOne();
      }
    }

    // счётчик — раз в секунду, вместе с именем
    if (now > NAME_DELAY_MS) {
      var s = Math.floor(Date.now() / 1000);
      if (s !== lastSecond) { lastSecond = s; updateCounter(); }
      if (!counterEl.classList.contains('on')) counterEl.classList.add('on');
    }

    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      heartToScreen(p, pulse, tmp);

      // возврат после тапа: затухающая пружина
      if (p.ox || p.oy || p.ovx || p.ovy) {
        p.ovx += (-SPRING_K * p.ox - SPRING_C * p.ovx) * dts;
        p.ovy += (-SPRING_K * p.oy - SPRING_C * p.ovy) * dts;
        p.ox += p.ovx * dts;
        p.oy += p.ovy * dts;
        if (Math.abs(p.ox) < 0.05 && Math.abs(p.oy) < 0.05 &&
            Math.abs(p.ovx) < 0.5 && Math.abs(p.ovy) < 0.5) {
          p.ox = p.oy = p.ovx = p.ovy = 0;
        }
      }

      var jx = Math.sin(sec * p.jxSpeed + p.jxPhase) * p.jAmp;
      var jy = Math.cos(sec * p.jySpeed + p.jyPhase) * p.jAmp;
      var a = p.alpha * (0.68 + 0.32 * Math.sin(sec * p.twSpeed + p.twPhase));
      a *= 1 + 0.55 * flash;

      if (p.state === 'fly') {
        var e = (now - p.t0 - p.delay) / p.dur;
        if (e <= 0) {
          p.x = p.sx; p.y = p.sy;
          a *= 0.25;
        } else if (e >= 1) {
          p.state = 'settled';
          p.x = tmp.x + jx;
          p.y = tmp.y + jy;
        } else {
          var ke = easeInOutCubic(e);
          p.x = p.sx + (tmp.x + jx - p.sx) * ke;
          p.y = p.sy + (tmp.y + jy - p.sy) * ke;
          a *= 0.25 + 0.75 * ke;
        }
      } else if (p.state === 'settled') {
        p.x = tmp.x + jx;
        p.y = tmp.y + jy;
      } else { // escape
        p.ex += p.evx * dts;
        p.ey += p.evy * dts;
        p.evy -= 6 * dts;
        p.efade -= dt / 2400;
        p.x = p.ex;
        p.y = p.ey;
        a *= Math.max(0, p.efade);
        if (p.efade <= 0) {
          // на её место приходит новая надпись
          refreshWord(p);
          spawnFrom(p);
          p.state = 'fly';
          p.t0 = now;
          p.delay = 0;
          p.dur = rand(1400, 2200);
          p.ox = p.oy = p.ovx = p.ovy = 0;
          continue;
        }
      }

      p.x += p.ox;
      p.y += p.oy;

      if (a <= 0.01 || !p.sprite) continue;
      ctx.globalAlpha = Math.min(1, a * 0.88);
      ctx.drawImage(p.sprite, p.x - p.sw / 2, p.y - p.sh / 2, p.sw, p.sh);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawName(now);

    requestAnimationFrame(frame);
  }

  /* ---------- музыка (YouTube IFrame API, молча падает при любой ошибке) ---------- */
  var player = null, musicDead = false;

  function killMusic() {
    musicDead = true;
    musicEl.classList.remove('ready', 'awake');
  }

  function startMusic() {
    try {
      if (window.YT && window.YT.Player) { createPlayer(); return; }

      window.onYouTubeIframeAPIReady = function () {
        try { createPlayer(); } catch (e) { killMusic(); }
      };

      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.async = true;
      tag.onerror = killMusic;
      document.head.appendChild(tag);

      // API не отвечает — просто живём без звука
      setTimeout(function () { if (!player) killMusic(); }, 9000);
    } catch (e) { killMusic(); }
  }

  function createPlayer() {
    if (musicDead) return;
    player = new window.YT.Player('yt', {
      videoId: YT_ID,
      width: '200',
      height: '200',
      playerVars: {
        autoplay: 1,
        controls: 0,
        loop: 1,
        playlist: YT_ID,     // нужен для loop одного ролика
        playsinline: 1,
        rel: 0,
        fs: 0,
        disablekb: 1,
        modestbranding: 1,
        iv_load_policy: 3
      },
      events: {
        onReady: function (e) {
          try {
            e.target.setVolume(MUSIC_VOLUME);
            e.target.playVideo();
          } catch (_) {}
          musicEl.classList.add('ready');
        },
        onStateChange: function (e) {
          // страховка на случай, если loop не сработал
          if (e.data === window.YT.PlayerState.ENDED) {
            try { e.target.seekTo(0); e.target.playVideo(); } catch (_) {}
          }
        },
        onError: killMusic
      }
    });
  }

  /* ---------- плеер: пробуждение по касанию ---------- */
  var awakeTimer = 0;
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    musicEl.classList.add('no-scrim'); // на десктопе хватает :hover
  }
  scrimEl.addEventListener('pointerdown', function (e) {
    e.stopPropagation();
    musicEl.classList.add('awake');
    clearTimeout(awakeTimer);
    awakeTimer = setTimeout(function () { musicEl.classList.remove('awake'); }, 6000);
  });

  /* ---------- старт ---------- */
  function start(e) {
    if (started) return;
    started = true;
    tapEl.classList.add('gone');
    setTimeout(function () { tapEl.style.display = 'none'; }, 800);

    startMusic();

    startTime = performance.now();
    lastFrame = 0;
    requestAnimationFrame(frame);
  }

  window.addEventListener('pointerdown', function (e) {
    if (musicEl.contains(e.target)) return;   // тап по плееру — не трогаем сердце
    if (!started) { start(e); return; }
    burst(e.clientX, e.clientY);
  }, { passive: true });

  /* ---------- ресайз / поворот ---------- */
  var layoutRaf = 0, spriteTimer = 0;
  function onResize() {
    if (layoutRaf) cancelAnimationFrame(layoutRaf);
    layoutRaf = requestAnimationFrame(function () {
      layoutRaf = 0;
      resize();
      // спрайты зависят от масштаба — перерисовываем, когда он заметно изменился
      if (DPR !== spriteDpr || Math.abs(scale - spriteScale) > spriteScale * 0.02) {
        clearTimeout(spriteTimer);
        spriteTimer = setTimeout(buildSprites, 160);
      }
    });
  }

  resize();
  buildParticles();
  buildSprites();
  updateCounter();

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', onResize, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) lastFrame = 0;
  });
})();
</script>
</body>
</html>
