<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>&#9825;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #c {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: #000;
    z-index: 0;
  }

  /* экран старта */
  #tap {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 300 clamp(15px, 3.4vmin, 26px)/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: #7fd4ff;
    text-shadow: 0 0 18px rgba(77, 166, 255, 0.55);
    animation: breathe 2.8s ease-in-out infinite;
    transition: opacity 0.7s ease;
    cursor: pointer;
  }
  #tap.gone { opacity: 0 !important; pointer-events: none; animation: none; }
  @keyframes breathe {
    0%, 100% { opacity: 0.22; }
    50%      { opacity: 0.78; }
  }

  /* счётчик */
  #counter {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2vmin);
    z-index: 2;
    font: 400 clamp(11px, 2.5vmin, 19px)/1 ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
    letter-spacing: 0.12em;
    white-space: nowrap;
    color: #7fd4ff;
    text-shadow: 0 0 12px rgba(77, 166, 255, 0.45);
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }
  #counter.on { opacity: 0.5; }

  /* кнопки в углах — тот же тонкий стиль, что у остального интерфейса */
  .ui {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 2.6vmin);
    z-index: 4;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 1px solid rgba(127, 212, 255, 0.26);
    border-radius: 999px;
    padding: 0.62em 1.05em;
    font: 300 clamp(10px, 2vmin, 14px)/1 ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: #7fd4ff;
    text-shadow: 0 0 10px rgba(77, 166, 255, 0.5);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, border-color 0.35s ease;
    touch-action: manipulation;
  }
  .ui.on { opacity: 0.34; pointer-events: auto; }
  .ui.on:hover, .ui.on:active { opacity: 1; border-color: rgba(127, 212, 255, 0.62); }
  .ui:disabled { opacity: 0.1 !important; pointer-events: none; }

  #snd {
    left: calc(env(safe-area-inset-left, 0px) + 2.6vmin);
    padding: 0.62em 0.86em;
    letter-spacing: 0;
    text-indent: 0;
    font-size: clamp(12px, 2.3vmin, 16px);
  }
  #snd.off { text-decoration: line-through; }

  #face { right: calc(env(safe-area-inset-right, 0px) + 2.6vmin); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="counter"></div>
<button id="snd" class="ui" type="button" aria-label="звук">&#9834;</button>
<button id="face" class="ui" type="button">портрет</button>
<div id="tap">нажми</div>
<script>
(function () {
  'use strict';

  /* ================= НАСТРОЙКИ ================= */

  // слова, из которых собирается сердце (регистр подставляется случайно)
  const WORDS = ["Мари", "Марина", "люблю тебя", "love you", "моя", "навсегда"];

  // дата, от которой считается счётчик внизу экрана
  const START_DATE = new Date("2026-04-01");

  const COLORS = ['#4da6ff', '#7fd4ff', '#bde7ff'];

  const RELEASE_SND_GAP_MS = 1500;  // не чаще одного звука отрыва за этот интервал

  const PORT_MIN = 3200;        // символов в портрете: телефон
  const PORT_MAX = 5500;        // символов в портрете: широкий десктоп

  const FPS_SAMPLE_MS = 2000;   // длина окна замера

  const PORT_WORK_W = 340;      // рабочее разрешение анализа фото, px

  const PORT_WHITE = 172;       // точка белого
  const PORT_GAMMA = 0.95;      // гамма тоновой кривой
  const PORT_EDGE = 0.28;       // доля карты краёв в примеси к тону

  const PORT_SIZE = [0.0075, 0.0145];   // кегль символа долей от ширины портрета
  const PORT_ALPHA_MIN = 0.08;  // прозрачность самых тёмных символов портрета
  const PORT_ALPHA_GAMMA = 1.22; // контраст по прозрачности
  const PORT_BLUR = 0.44;       // свечение символа в долях кегля (в сердце 0.85)
  const PORT_FIT = 0.98;        // насколько плотно портрет вписан в экран
  const PORT_PAD = 0.035;       // боковые поля портрета, доля меньшей стороны экрана
  const PORT_SIZE_BUCKETS = 4;  // число корзин кегля в общем атласе спрайтов

  // Под другое фото: x/y — центр глаза, rx/ry — полуоси эллипса вокруг него.
  // EYE_BOOST_ON = false выключает всё это и даёт полностью автоматический режим.
  const EYE_BOOST_ON = true;
  const EYE_L = { x: 0.2264, y: 0.212, rx: 0.105, ry: 0.064 };
  const EYE_R = { x: 0.7925, y: 0.200, rx: 0.105, ry: 0.064 };
  const EYE_GAIN = 1.00;        // насколько вытягиваем светлое в глазу
  const EYE_DIG  = 0.65;        // насколько углубляем тёмное в дыру

  const MORPH_MS = 2600;        // длительность перехода сердце <-> портрет
  const MORPH_STAGGER = 0.34;   // разброс задержек по частицам, доля от перехода
  const MORPH_SPREAD = 0.20;    // разлёт в середине траектории, доля ширины портрета

  var CHAR_POOL = (function () {
    var seen = {}, out = [];
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      for (var j = 0; j < w.length; j++) {
        var ch = w.charAt(j);
        if (ch === ' ') continue;
        var lo = ch.toLowerCase(), up = ch.toUpperCase();
        if (!seen[lo]) { seen[lo] = 1; out.push(lo); }
        if (!seen[up]) { seen[up] = 1; out.push(up); }
      }
    }
    return out.length ? out : ['*'];
  })();

  /* ---------- форма сердца (параметрическое уравнение) ---------- */
  // x = 16 sin^3 t ; y = 13 cos t - 5 cos 2t - 2 cos 3t - cos 4t
  function heartPoint(t) {
    var s = Math.sin(t);
    return {
      x: 16 * s * s * s,
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    };
  }

  var HEART_MID_Y = 0, HEART_SPAN_Y = 29, HEART_SPAN_X = 32;
  (function () {
    var minY = Infinity, maxY = -Infinity, maxX = 0;
    for (var i = 0; i <= 2000; i++) {

      if (q.y < minY) minY = q.y;
      if (q.y > maxY) maxY = q.y;
      if (Math.abs(q.x) > maxX) maxX = Math.abs(q.x);

    HEART_SPAN_Y = maxY - minY;
    HEART_SPAN_X = maxX * 2;
  })();

  var ARC = (function () {

    for (var i = 0; i <= N; i++) {
      var t = (i / N) * Math.PI * 2;
      var q = heartPoint(t);
      total += Math.hypot(q.x - prev.x, q.y - prev.y);
      ts.push(t); len.push(total);
      prev = q;
    }
    return { t: ts, len: len, total: total };
  })();

  // один тон с мягкой огибающей: атака >= 8 мс, длительность <= 250 мс
  function tone(freq, durMs, peak, type, freqEnd, delayMs) {
    if (!actx || !soundOn) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime + (delayMs || 0) / 1000;
      var dur = Math.min(250, durMs) / 1000;
      var atk = Math.max(0.008, SND_ATTACK_MS / 1000);
      if (atk > dur * 0.6) atk = dur * 0.6;
      var g = Math.min(SND_GAIN, peak);

      var osc = actx.createOscillator();
      var amp = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (freqEnd && freqEnd !== freq) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);

      amp.gain.setValueAtTime(0.0001, t0);
      amp.gain.linearRampToValueAtTime(g, t0 + atk);
      amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(amp);
      amp.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* звук — не повод ронять анимацию */ }
  }

      // немного внутри контура — сжатие к центру фигуры
      var k = 0.22 + Math.sqrt(Math.random()) * 0.60;
      hx = q.x * k;
      hy = (q.y - HEART_MID_Y) * k + HEART_MID_Y;
    }
    return { hx: hx, hy: hy, inside: inside };
  }

  function buildParticles() {
    wordTotal = wordCount();
    portTotal = Math.max(wordTotal, portraitCount());

    var contourWords = Math.round(wordTotal * 0.68);
    var contourRest = Math.max(1, Math.round((portTotal - wordTotal) * 0.68));
    var list = [];

    for (var i = 0; i < portTotal; i++) {
      var isWord = i < wordTotal;
      var slot = isWord ? heartSlot(i, contourWords) : heartSlot(i - wordTotal, contourRest);
      var inside = slot.inside;

      var p = {
        hx: slot.hx,
        hy: slot.hy,
        inside: inside,
        portOnly: !isWord,
        cull: Math.random(),

        text: isWord ? styledWord() : '',
        sizeK: inside ? rand(SIZE_IN[0], SIZE_IN[1]) : rand(SIZE_EDGE[0], SIZE_EDGE[1]),
        color: pick(COLORS),
        // частицы, которых в сердце не видно, имеют нулевую прозрачность:
        // морф сам поднимет её через смешивание с портретной
        alpha: isWord ? (inside ? rand(0.3, 0.72) : rand(0.55, 1.0)) : 0,

        // портрет
        ch: pick(CHAR_POOL),
        chColor: pick(COLORS),
        nx: 0, ny: 0, pv: 0, pa: 0,
        chBucket: 0,
        chSprite: null, chW: 0, chH: 0,

        // морф
        mDelay: Math.random() * MORPH_STAGGER,
        mSpin: rand(-1, 1),

        // мерцание и дрожание
        twPhase: rand(0, Math.PI * 2),
        twSpeed: rand(0.6, 2.0),
        jxPhase: rand(0, Math.PI * 2),
        jyPhase: rand(0, Math.PI * 2),
        jxSpeed: rand(0.5, 1.5),
        jySpeed: rand(0.5, 1.5),
        jAmp: rand(0.6, 2.2),

        // состояние: fly -> settled -> escape -> fly
        state: 'fly',
        t0: 0,
        dur: ASSEMBLE_MS,
        delay: Math.random() * 550,
        sx: 0, sy: 0,      // точка старта
        ex: 0, ey: 0,      // позиция при отлёте
        evx: 0, evy: 0,
        efade: 1,
        ox: 0, oy: 0,      // отклонение от тапа
        ovx: 0, ovy: 0,
        x: 0, y: 0,
        px: 12,
        sprite: null, sw: 0, sh: 0
      };
      spawnFrom(p);
      list.push(p);
    }
    particles = list;
  }

  function spawnFrom(p) {
    p.sx = rand(-0.1, 1.1) * W;
    p.sy = rand(-0.1, 1.1) * H;
  }

  function refreshWord(p) {
    p.text = styledWord();
    p.color = pick(COLORS);
    p.sizeK = p.inside ? rand(SIZE_IN[0], SIZE_IN[1]) : rand(SIZE_EDGE[0], SIZE_EDGE[1]);
    p.alpha = p.inside ? rand(0.3, 0.72) : rand(0.55, 1.0);
    makeSprite(p);
  }

  /* ---------- спрайты ---------- */
  // Слова: свой спрайт на частицу — их всего пара сотен.
  // Символы портрета: ОБЩИЙ атлас по ключу (символ, цвет, корзина кегля).
  // Иначе на 5500 частиц пришлось бы 5500 отдельных канвасов и десятки мегабайт.

  // длинные слова чуть мельче — иначе контур сердца размывается
  function lenFactor(text) {
    return Math.max(0.62, Math.min(1, 7 / text.length));
  }

  function drawGlyph(text, px, color, blurK) {
    var font = monoFont(px);
    measure.font = font;
    var tw = Math.max(1, measure.measureText(text).width);
    var blur = px * blurK;
    var pad = Math.ceil(blur * 1.25 + 4); // рамка под свечение: меньше рамка — меньше заливки в кадре

    var cw = Math.ceil(tw) + pad * 2;
    var ch = Math.ceil(px * 1.7) + pad * 2;

    var off = document.createElement('canvas');
    off.width = Math.max(1, Math.ceil(cw * DPR));
    off.height = Math.max(1, Math.ceil(ch * DPR));
    var g = off.getContext('2d');
    g.scale(DPR, DPR);
    g.font = font;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillStyle = color;
    g.shadowColor = color;
    g.shadowBlur = blur;
    g.fillText(text, pad, ch / 2);
    g.shadowBlur = blur * 0.5;
    g.fillText(text, pad, ch / 2);

    return { c: off, w: cw, h: ch };
  }

  function makeSprite(p) {
    p.px = Math.max(6, p.sizeK * HEART_SPAN_X * scale * lenFactor(p.text));
    var s = drawGlyph(p.text, p.px, p.color, 0.85);
    p.sprite = s.c;
    p.sw = s.w;
    p.sh = s.h;
  }

  var atlas = {};

  function bucketPx(b) {
    var k = PORT_SIZE_BUCKETS > 1 ? b / (PORT_SIZE_BUCKETS - 1) : 0;
    return Math.max(4, portScale * (PORT_SIZE[0] + (PORT_SIZE[1] - PORT_SIZE[0]) * k));
  }

  function makeCharSprite(p) {
    var key = p.ch + '|' + p.chColor + '|' + p.chBucket;
    var s = atlas[key];
    if (!s) {
      s = drawGlyph(p.ch, bucketPx(p.chBucket), p.chColor, PORT_BLUR);
      atlas[key] = s;
    }
    p.chSprite = s.c;
    p.chW = s.w;
    p.chH = s.h;
  }

  function buildSprites() {
    atlas = {};
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!p.portOnly) makeSprite(p);
      if (portReady) makeCharSprite(p);
    }
    spriteScale = scale;
    spriteDpr = DPR;
    spritePortScale = portScale;
  }

  /* ---------- размеры / ретина / адаптивность ---------- */
  function resize() {
    W = canvas.clientWidth || window.innerWidth;
    H = canvas.clientHeight || window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // поля: по бокам под ширину самих надписей, снизу под счётчик
    var padX = Math.max(26, Math.min(W, H) * 0.11);
    var padTop = Math.max(22, H * 0.06);
    var padBottom = Math.max(52, H * 0.12);

    var fitW = (W - padX * 2) / HEART_SPAN_X;
    var fitH = (H - padTop - padBottom) / HEART_SPAN_Y;
    var target = (Math.min(W, H) * 0.74) / HEART_SPAN_Y; // ~70% меньшей стороны

    scale = Math.max(3, Math.min(fitW, fitH, target));
    cx = W / 2;
    cy = padTop + (H - padTop - padBottom) / 2;

    // у портрета своя пропорция и свой фит: общий с сердцем масштаб
    // в альбомной ориентации вылез бы за верх и низ экрана
    var padPort = Math.max(10, Math.min(W, H) * PORT_PAD);
    var availW = W - padPort * 2;
    var availH = H - padTop - padBottom;
    portScale = Math.max(3, Math.min(availW, availH / portAspect) * PORT_FIT);
    portCx = W / 2;
    portCy = padTop + availH / 2;

    nameSprite = null;
  }

  function heartToScreen(p, k, out) {
    out.x = cx + p.hx * scale * k;
    out.y = cy - (p.hy - HEART_MID_Y) * scale * k;
  }

  function portToScreen(p, k, out) {
    out.x = portCx + p.nx * portScale * k;
    out.y = portCy + p.ny * portScale * k;
  }

  /* ---------- биение сердца ---------- */
  function beat(phase) {
    var a = Math.exp(-Math.pow((phase - 0.13) / 0.085, 2));
    var b = 0.55 * Math.exp(-Math.pow((phase - 0.35) / 0.10, 2));
    return Math.min(1, a + b);
  }

  /* ---------- надпись с именем ---------- */
  var nameSprite = null, nameW = 0, nameH = 0, nameSize = 40;

  function buildNameSprite() {
    var size = HEART_SPAN_X * scale * NAME_SIZE;
    var font = function (px) {
      return '600 ' + px.toFixed(1) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    };
    // вписываем имя внутрь сердца
    measure.font = font(size);
    var maxW = Math.min(W * 0.62, HEART_SPAN_X * scale * 0.60);
    var tw = measure.measureText(NAME).width;
    if (tw > maxW) { size *= maxW / tw; measure.font = font(size); tw = measure.measureText(NAME).width; }

    var blur = size * 0.75;
    var pad = Math.ceil(blur * 2.2);
    var cw = Math.ceil(tw) + pad * 2;
    var ch = Math.ceil(size * 1.6) + pad * 2;

    var off = document.createElement('canvas');
    off.width = Math.max(1, Math.ceil(cw * DPR));
    off.height = Math.max(1, Math.ceil(ch * DPR));
    var g = off.getContext('2d');
    g.scale(DPR, DPR);
    g.font = font(size);
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    // мягкое свечение несколькими проходами
    g.shadowColor = '#4da6ff';
    g.shadowBlur = blur;
    g.fillStyle = '#7fd4ff';
    g.fillText(NAME, cw / 2, ch / 2);
    g.shadowColor = '#7fd4ff';
    g.shadowBlur = blur * 0.45;
    g.fillText(NAME, cw / 2, ch / 2);
    g.shadowBlur = blur * 0.2;
    g.fillStyle = '#eaf7ff';
    g.fillText(NAME, cw / 2, ch / 2);

    nameSprite = off;
    nameW = cw;
    nameH = ch;
    nameSize = size;
  }

  // hide: 0 — имя как обычно, 1 — полностью убрано (режим портрета)
  function drawName(now, hide) {
    var age = now - NAME_DELAY_MS;
    if (age <= 0 || hide >= 1) return;
    if (!nameSprite) buildNameSprite();

    var k = Math.min(1, age / NAME_FADE_MS);
    var e = (1 - Math.pow(1 - k, 3)) * (1 - hide);
    if (e <= 0.002) return;
    var breathe = 1 + 0.015 * Math.sin(now / 900);
    var sc = (0.86 + 0.14 * e) * breathe;
    var ny = cy - scale * 0.8;
    var size = nameSize;

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';

    // мягко притеняем надписи под именем, чтобы оно читалось
    var rg = ctx.createRadialGradient(cx, ny, 0, cx, ny, size * 2.6);
    rg.addColorStop(0, 'rgba(0,0,0,' + (0.62 * e).toFixed(3) + ')');
    rg.addColorStop(0.55, 'rgba(0,0,0,' + (0.38 * e).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(cx - size * 2.8, ny - size * 2.8, size * 5.6, size * 5.6);

    ctx.globalAlpha = e;
    ctx.translate(cx, ny);
    ctx.scale(sc, sc);
    ctx.drawImage(nameSprite, -nameW / 2, -nameH / 2, nameW, nameH);
    ctx.restore();
  }

  /* ---------- счётчик ---------- */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function daysWord(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'день';
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 'дня';
    return 'дней';
  }
  function updateCounter() {
    var diff = Date.now() - START_DATE.getTime();
    if (!isFinite(diff) || diff < 0) diff = 0;
    var total = Math.floor(diff / 1000);
    var days = Math.floor(total / 86400);
    var rest = total % 86400;
    var d = String(days);
    while (d.length < 3) d = '0' + d;
    counterEl.textContent = 'вместе ' + d + ' ' + daysWord(days) + ' ' +
      pad2(Math.floor(rest / 3600)) + ':' + pad2(Math.floor((rest % 3600) / 60)) + ':' + pad2(rest % 60);
  }

  /* ---------- отрыв надписей и возврат новых ---------- */
  function releaseOne(now) {
    var tries = 12;
    while (tries--) {
      var p = particles[(Math.random() * particles.length) | 0];
      if (p.state === 'settled' && !p.portOnly) {
        p.state = 'escape';
        p.ex = p.x - p.ox;
        p.ey = p.y - p.oy;
        p.evx = rand(-14, 14);
        p.evy = rand(-34, -16);
        p.efade = 1;
        sndRelease(now);
        return;
      }
    }
  }

  /* ---------- вспышка от касания: работает и в сердце, и в портрете ---------- */
  function burst(px, py) {
    flash = 1;
    var span = morph > 0.5 ? portScale : HEART_SPAN_X * scale;
    var R = span * 0.42;
    var power = span * 3.0; // импульс пропорционален размеру фигуры
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.portOnly && (p.cull >= keepFrac || morph <= 0)) continue;
      var dx = p.x - px, dy = p.y - py;
      var d = Math.hypot(dx, dy);
      if (d < 0.001) { dx = rand(-1, 1); dy = rand(-1, 1); d = Math.hypot(dx, dy); }
      var f = power * (R / (d + R)) * rand(0.75, 1.25);
      p.ovx += (dx / d) * f;
      p.ovy += (dy / d) * f;
    }
    sndBurst();
  }

  /* ================= ПОРТРЕТ ИЗ ФОТО ================= */

  var portReady = false;

  function boxH(src, dst, w, h, r) {
    var d = 2 * r + 1;
    for (var y = 0; y < h; y++) {
      var row = y * w, sum = 0, i;
      for (i = -r; i <= r; i++) sum += src[row + Math.min(w - 1, Math.max(0, i))];
      for (var x = 0; x < w; x++) {
        dst[row + x] = sum / d;
        sum += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
      }
    }
  }

  function boxV(src, dst, w, h, r) {
    var d = 2 * r + 1;
    for (var x = 0; x < w; x++) {
      var sum = 0, i;
      for (i = -r; i <= r; i++) sum += src[Math.min(h - 1, Math.max(0, i)) * w + x];
      for (var y = 0; y < h; y++) {
        dst[y * w + x] = sum / d;
        sum += src[Math.min(h - 1, y + r + 1) * w + x] - src[Math.max(0, y - r) * w + x];
      }
    }
  }

  // три прохода коробочного размытия ~ гаусс
  function blurApprox(src, w, h, sigma) {
    var r = Math.max(1, Math.round(sigma * 1.2));
    var cur = src, tmpBuf = new Float32Array(w * h), out = new Float32Array(w * h);
    for (var p = 0; p < 3; p++) {
      boxH(cur, tmpBuf, w, h, r);
      boxV(tmpBuf, out, w, h, r);
      cur = out;
      if (p < 2) out = new Float32Array(w * h);
    }
    return cur;
  }

  // медиана 3x3 — сбивает отдельные пряди волос, которые иначе съедают весь бюджет
  function median3(src, w, h) {
    var out = new Float32Array(w * h), v = new Float32Array(9);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var k = 0;
        for (var dy = -1; dy <= 1; dy++) {
          var yy = Math.min(h - 1, Math.max(0, y + dy)) * w;
          for (var dx = -1; dx <= 1; dx++) {
            v[k++] = src[yy + Math.min(w - 1, Math.max(0, x + dx))];
          }
        }
        for (var a = 1; a < 9; a++) {
          var t = v[a], b = a - 1;
          while (b >= 0 && v[b] > t) { v[b + 1] = v[b]; b--; }
          v[b + 1] = t;
        }
        out[y * w + x] = v[4];
      }
    }
    return out;
  }

  function sobelMag(src, w, h) {
    var m = new Float32Array(w * h);
    for (var y = 1; y < h - 1; y++) {
      for (var x = 1; x < w - 1; x++) {
        var i = y * w + x;
        var gx = src[i + 1] - src[i - 1];
        var gy = src[i + w] - src[i - w];
        m[i] = Math.sqrt(gx * gx + gy * gy);
      }
    }
    return m;
  }

  function percentile(arr, p) {
    var max = 0, i;
    for (i = 0; i < arr.length; i++) if (arr[i] > max) max = arr[i];
    if (max <= 0) return 1;
    var bins = new Int32Array(512);
    for (i = 0; i < arr.length; i++) bins[Math.min(511, (arr[i] / max * 511) | 0)]++;
    var target = arr.length * p, acc = 0;
    for (var b = 0; b < 512; b++) {
      acc += bins[b];
      if (acc >= target) return ((b + 0.5) / 511) * max;
    }
    return max;
  }

  // Локальный буст зоны глаза: поднимаем светлое (белок, блик на радужке),
  // углубляем тёмное (радужку, тень глазницы). Тёмное символами не рисуем —
  // оно остаётся дырой, которую очерчивает светлое вокруг.
  function eyeBoost(V, det, fine, w, h, eye) {
    var ex = eye.x * w, ey = eye.y * h;
    var rx = Math.max(2, eye.rx * w), ry = Math.max(2, eye.ry * h);
    var x0 = Math.max(0, Math.floor(ex - rx)), x1 = Math.min(w - 1, Math.ceil(ex + rx));
    var y0 = Math.max(0, Math.floor(ey - ry)), y1 = Math.min(h - 1, Math.ceil(ey + ry));
    var x, y, i, dx, dy, q, sum = 0, cnt = 0, lo = 1e9, hi = -1e9;

    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        dx = (x - ex) / rx; dy = (y - ey) / ry;
        if (dx * dx + dy * dy > 1) continue;
        i = y * w + x;
        q = fine[i];
        sum += q; cnt++;
        if (q < lo) lo = q;
        if (q > hi) hi = q;
      }
    }
    if (cnt < 8 || hi - lo < 1) return;
    var mean = sum / cnt;

    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        dx = (x - ex) / rx; dy = (y - ey) / ry;
        var rr = dx * dx + dy * dy;
        if (rr > 1) continue;
        i = y * w + x;
        var f = 1 - rr;            // мягкое затухание к краю эллипса
        f = f * f * (3 - 2 * f);   // smoothstep
        q = fine[i];
        if (q > mean) {
          var up = (q - mean) / Math.max(1, hi - mean);
          V[i] = clamp01(V[i] + EYE_GAIN * f * Math.pow(up, 1.15));
        } else {
          var down = (mean - q) / Math.max(1, mean - lo);
          V[i] = V[i] * (1 - EYE_DIG * f * down);
        }
        // в зоне глаза символы мельче и гуще
        if (det[i] < f * 0.85) det[i] = f * 0.85;
      }
    }
  }

  // Равномерное покрытие (Poisson-disk) с шагом, зависящим от детализации.
  // Тон несут прозрачность и кегль символа, а не плотность точек: на нескольких
  // тысячах элементов это даёт заметно больше градаций, чем дизеринг.
  function poissonPoints(V, det, w, h, want) {
    var idx = [], i;
    for (i = 0; i < w * h; i++) if (V[i] > PORT_THRESHOLD) idx.push(i);
    if (!idx.length) return [];
    for (i = idx.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }

    var area = idx.length;
    var base = Math.sqrt(area / Math.max(1, want)) * 0.97;
    var cell = Math.max(1, base);
    var gw = Math.ceil(w / cell), gh = Math.ceil(h / cell);
    var grid = new Array(gw * gh);
    var pts = [];
    var passes = [1.0, 0.86, 0.74, 0.62, 0.52, 0.44];

    for (var s = 0; s < passes.length && pts.length < want; s++) {
      var r0 = base * passes[s];
      for (var k = 0; k < idx.length && pts.length < want; k++) {
        var id = idx[k];
        if (id < 0) continue;
        var y = (id / w) | 0, x = id - y * w;
        var r = r0 * (0.48 + 0.74 * (1 - det[id]));
        var gx = (x / cell) | 0, gy = (y / cell) | 0;
        var bad = false;

        for (var ddy = -2; ddy <= 2 && !bad; ddy++) {
          var cyi = gy + ddy;
          if (cyi < 0 || cyi >= gh) continue;
          for (var ddx = -2; ddx <= 2 && !bad; ddx++) {
            var cxi = gx + ddx;
            if (cxi < 0 || cxi >= gw) continue;
            var cellPts = grid[cyi * gw + cxi];
            if (!cellPts) continue;
            for (var m = 0; m < cellPts.length; m += 3) {
              var qx = cellPts[m] - x, qy = cellPts[m + 1] - y;
              var rr = Math.min(r, cellPts[m + 2]);
              if (qx * qx + qy * qy < rr * rr) { bad = true; break; }
            }
          }
        }
        if (bad) continue;

        var ci = gy * gw + gx;
        if (!grid[ci]) grid[ci] = [];
        grid[ci].push(x, y, r);
        pts.push({ x: x, y: y, v: Math.min(1, V[id]), nx: 0, ny: 0 });
        idx[k] = -1;
      }
    }
    return pts;
  }

  function buildPortrait(img) {
    var cropW = Math.max(1, (PHOTO_CROP.right - PHOTO_CROP.left) * img.width);
    var cropH = Math.max(1, (PHOTO_CROP.bottom - PHOTO_CROP.top) * img.height);
    var w = PORT_WORK_W;
    var h = Math.max(8, Math.round(w * cropH / cropW));

    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    var g = off.getContext('2d', { willReadFrequently: true });
    g.drawImage(img,
      PHOTO_CROP.left * img.width, PHOTO_CROP.top * img.height, cropW, cropH,
      0, 0, w, h);

    var data = g.getImageData(0, 0, w, h).data;
    var n = w * h, i;
    var lum = new Float32Array(n);
    for (i = 0; i < n; i++) {
      lum[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
    }

    var med = median3(lum, w, h);
    var fine = blurApprox(med, w, h, 0.8);    // сохраняет глаза и губы
    var soft = blurApprox(med, w, h, 2.6);    // убивает текстуру волос

    var mag = sobelMag(soft, w, h);
    var norm = percentile(mag, 0.985);
    var edge = new Float32Array(n);
    for (i = 0; i < n; i++) edge[i] = clamp01(mag[i] / norm);

    var det = blurApprox(edge, w, h, 2.4);    // где мелко — там гуще и мельче символы
    var edgeSoft = blurApprox(edge, w, h, 0.9);

    var V = new Float32Array(n);
    var range = Math.max(1, PORT_WHITE - PORT_BLACK);
    for (var y = 0; y < h; y++) {
      var fy = (y / h - 0.47) / 0.62;
      for (var x = 0; x < w; x++) {
        i = y * w + x;
        var fx = (x / w - 0.50) / 0.615;
        var vig = clamp01((PORT_VIGNETTE - fx * fx - fy * fy) * 1.7);
        // тон берём детальным там, где есть мелкая структура, иначе сглаженным
        var d = det[i];
        var a = soft[i] * (1 - d) + fine[i] * d;
        var tone2 = Math.pow(clamp01((a - PORT_BLACK) / range), PORT_GAMMA);
        V[i] = clamp01(tone2 * (1 - 0.3 * PORT_EDGE) + edgeSoft[i] * PORT_EDGE) * vig;
      }
    }

    if (EYE_BOOST_ON) {
      eyeBoost(V, det, fine, w, h, EYE_L);
      eyeBoost(V, det, fine, w, h, EYE_R);
    }

    var top = percentile(V, 0.995);
    for (i = 0; i < n; i++) V[i] = clamp01(V[i] / Math.max(1e-6, top));

    var pts = poissonPoints(V, det, w, h, portTotal);
    if (!pts.length) return false;

    portAspect = h / w;

    // нормируем в ту же логику, что hx/hy: единица = ширина портрета
    for (i = 0; i < pts.length; i++) {
      pts[i].nx = (pts[i].x + 0.5) / w - 0.5;
      pts[i].ny = ((pts[i].y + 0.5) / h - 0.5) * portAspect;
    }

    assignTargets(pts);
    return true;
  }

  /* ---------- сопоставление сердце -> портрет ---------- */
  // Оба набора сортируем по углу вокруг своего центра и связываем по порядку —
  // так траектории почти не пересекаются. Затем несколько проходов локальных
  // обменов добивают радиальную согласованность.
  function assignTargets(pts) {
    var n = particles.length, i;
    if (!n || !pts.length) return;

    var hOrder = new Array(n);
    for (i = 0; i < n; i++) {
      var p = particles[i];
      // экранная ориентация: y вниз, как у портрета
      hOrder[i] = { i: i, a: Math.atan2(-(p.hy - HEART_MID_Y), p.hx) };
    }
    hOrder.sort(function (a, b) { return a.a - b.a; });

    var pOrder = new Array(pts.length);
    for (i = 0; i < pts.length; i++) {
      pOrder[i] = { i: i, a: Math.atan2(pts[i].ny, pts[i].nx) };
    }
    pOrder.sort(function (a, b) { return a.a - b.a; });

    // нормированные координаты сердца — чтобы метрика обмена была соизмерима с портретом
    var hnx = new Float32Array(n), hny = new Float32Array(n);
    for (i = 0; i < n; i++) {
      var q = particles[hOrder[i].i];
      hnx[i] = q.hx / HEART_SPAN_X;
      hny[i] = -(q.hy - HEART_MID_Y) / HEART_SPAN_X;
    }

    var link = new Int32Array(n);
    for (i = 0; i < n; i++) {
      link[i] = pOrder[Math.min(pOrder.length - 1, (i * pOrder.length / n) | 0)].i;
    }

    function cost(k, t) {
      var c = pts[t];
      var dx = hnx[k] - c.nx, dy = hny[k] - c.ny;
      return dx * dx + dy * dy;
    }
    for (var sweep = 0; sweep < 3; sweep++) {
      for (i = 0; i < n; i++) {
        for (var d = 1; d <= 8; d++) {
          var j = i + d;
          if (j >= n) break;
          var a = link[i], b = link[j];
          if (cost(i, b) + cost(j, a) < cost(i, a) + cost(j, b)) {
            link[i] = b; link[j] = a;
          }
        }
      }
    }

    for (i = 0; i < n; i++) {
      var part = particles[hOrder[i].i];
      var tgt = pts[link[i]];
      part.nx = tgt.nx;
      part.ny = tgt.ny;
      part.pv = tgt.v;
      part.pa = PORT_ALPHA_MIN + (1 - PORT_ALPHA_MIN) * Math.pow(tgt.v, PORT_ALPHA_GAMMA);
      part.chBucket = Math.round(tgt.v * (PORT_SIZE_BUCKETS - 1));
    }
  }

  function loadPortrait() {
    var img = new Image();
    img.onload = function () {
      try {
        portReady = buildPortrait(img);
      } catch (e) {
        portReady = false;
      }
      if (portReady) {
        resize();          // portAspect стал известен — пересчитать фит портрета
        buildSprites();
        if (uiShown) faceEl.disabled = false;
      }
    };
    img.onerror = function () { portReady = false; };
    img.src = PHOTO;
  }

  /* ================= МОРФ ================= */

  var morph = 0;          // 0 — сердце, 1 — портрет
  var morphTarget = 0;
  var morphFrom = 0;
  var morphT0 = 0;
  var morphDur = MORPH_MS;

  function toggleMorph() {
    if (!portReady || !started) return;
    morphFrom = morph;
    morphTarget = morphTarget > 0 ? 0 : 1;
    morphDur = Math.max(400, MORPH_MS * Math.abs(morphTarget - morphFrom));
    morphT0 = performance.now();
    faceEl.textContent = morphTarget > 0 ? 'сердце' : 'портрет';

    // улетающие надписи возвращаем в строй, иначе они выпадут из перехода
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.state === 'escape' || p.state === 'fly') {
        p.state = 'settled';
        p.efade = 1;
      }
    }

    if (morphTarget > 0) sndMorphOut(); else sndMorphBack();
  }

  /* ================= ЗАМЕР ПРОИЗВОДИТЕЛЬНОСТИ ================= */
  // Стартуем с целевого счёта и меряем среднее время кадра в двух окнах:
  // после сборки сердца и после первого перехода в портрет. Если хуже бюджета —
  // ОДИН раз понижаем счёт, и только в состоянии сердца, где лишние частицы
  // невидимы и понижение не заметно вообще. Решение фиксируется до конца сессии.

  var perfWindow = 0;      // 0 — ждём, 1 — меряем, 2 — окно закрыто
  var perfT0 = 0, perfFrames = 0, perfSum = 0;
  var perfChecks = 0, perfPending = false, perfApplied = false;

  function perfOpenWindow(now) {
    if (perfApplied || perfChecks >= 2) return;
    perfWindow = 1;
    perfT0 = now;
    perfFrames = 0;
    perfSum = 0;
  }

  function perfTick(now, dt) {
    if (perfApplied) return;
    if (perfWindow === 1) {
      perfFrames++;
      perfSum += dt;
      if (now - perfT0 >= FPS_SAMPLE_MS) {
        perfWindow = 2;
        perfChecks++;
        if (perfFrames > 10 && perfSum / perfFrames > FRAME_BUDGET_MS) perfPending = true;
      }
    }
    if (perfPending && morph <= 0 && morphTarget === 0) {
      perfPending = false;
      perfApplied = true;
      // режем только портретные частицы: слова сердца трогать нельзя
      keepFrac = clamp01((PORT_SAFE - wordTotal) / Math.max(1, portTotal - wordTotal));
    }
  }

  /* ---------- кадр ---------- */
  // пружина возврата после тапа: за BURST_MS частицы садятся обратно
  var SPRING_W = 5.7 * (1000 / BURST_MS);
  var SPRING_K = SPRING_W * SPRING_W;
  var SPRING_C = 2 * 0.7 * SPRING_W;

  var tmp = { x: 0, y: 0 };
  var tmp2 = { x: 0, y: 0 };
  var assembledSnd = false;
  var morphedOnce = false;

  function frame(ts) {
    if (!lastFrame) lastFrame = ts;
    var dt = Math.min(64, ts - lastFrame);
    lastFrame = ts;
    var now = ts - startTime;
    var sec = now / 1000;
    var dts = dt / 1000;

    // ---- морф ----
    if (morph !== morphTarget) {
      var mt = (ts - morphT0) / morphDur;
      morph = mt >= 1 ? morphTarget : morphFrom + (morphTarget - morphFrom) * mt;
      if (morph === morphTarget && morphTarget > 0 && !morphedOnce) {
        morphedOnce = true;
        perfOpenWindow(now);      // второе окно замера — уже с портретом на экране
      }
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    flash = Math.max(0, flash - dts / 0.55);

    var assembled = now > ASSEMBLE_MS * 0.9;
    // биение гаснет по мере ухода в портрет: при morph = 1 пульса нет
    var pulse = assembled
      ? 1 + BEAT_AMP * beat(((now - ASSEMBLE_MS * 0.9) % BEAT_MS) / BEAT_MS) * (1 - morph)
      : 1;
    pulse *= 1 + 0.05 * flash;

    if (!assembledSnd && now >= ASSEMBLE_MS) {
      assembledSnd = true;
      sndAssembled();
      perfOpenWindow(now);
    }

    // кнопки появляются, когда сердце уже собрано
    if (!uiShown && now > ASSEMBLE_MS + 400) {
      uiShown = true;
      sndEl.classList.add('on');
      faceEl.classList.add('on');
      faceEl.disabled = !portReady;
    }

    perfTick(now, dt);

    // периодический отрыв надписей — только пока мы в сердце
    if (now > ASSEMBLE_MS && morph <= 0 && morphTarget === 0) {
      escapeTimer -= dt;
      if (escapeTimer <= 0) {
        escapeTimer = rand(280, 620);
        releaseOne(ts);
      }
    }

    // счётчик — раз в секунду, вместе с именем
    if (now > NAME_DELAY_MS) {
      var s = Math.floor(Date.now() / 1000);
      if (s !== lastSecond) { lastSecond = s; updateCounter(); }
      if (!counterEl.classList.contains('on')) counterEl.classList.add('on');
    }

    ctx.globalCompositeOperation = 'lighter';

    var spread = MORPH_SPREAD * portScale;
    var flashK = 1 + 0.55 * flash;
    var flashScale = 1 + 0.05 * flash;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.portOnly && (p.cull >= keepFrac || morph <= 0)) continue;

      // собственный прогресс частицы: своя задержка плюс сглаживание
      var e = 0;
      if (morph > 0) {
        if (morph >= 1) e = 1;
        else {
          var local = (morph - p.mDelay) / (1 - MORPH_STAGGER);
          e = local <= 0 ? 0 : (local >= 1 ? 1 : easeInOutCubic(local));
        }
      }

      heartToScreen(p, pulse, tmp);

      if (e > 0) {
        portToScreen(p, flashScale, tmp2);
        var bx = tmp.x + (tmp2.x - tmp.x) * e;
        var by = tmp.y + (tmp2.y - tmp.y) * e;

        // лёгкий разлёт в середине траектории, потом сбор
        var sw = Math.sin(Math.PI * e);
        if (sw > 0.002) {
          var rx = bx - W * 0.5, ry = by - portCy;
          var rd = Math.hypot(rx, ry);
          if (rd < 0.001) { rx = 1; ry = 0; rd = 1; }
          var push = sw * spread;
          var ux = rx / rd, uy = ry / rd;
          bx += ux * push - uy * push * MORPH_SPIN * p.mSpin;
          by += uy * push + ux * push * MORPH_SPIN * p.mSpin;
        }
        tmp.x = bx;
        tmp.y = by;
      }

      // возврат после тапа: затухающая пружина
      if (p.ox || p.oy || p.ovx || p.ovy) {
        p.ovx += (-SPRING_K * p.ox - SPRING_C * p.ovx) * dts;
        p.ovy += (-SPRING_K * p.oy - SPRING_C * p.ovy) * dts;
        p.ox += p.ovx * dts;
        p.oy += p.ovy * dts;
        if (Math.abs(p.ox) < 0.05 && Math.abs(p.oy) < 0.05 &&
            Math.abs(p.ovx) < 0.5 && Math.abs(p.ovy) < 0.5) {
          p.ox = p.oy = p.ovx = p.ovy = 0;
        }
      }

      // дрожание гаснет к портрету: там оно только мылит лицо
      var jx = 0, jy = 0;
      if (e < 0.98) {
        var jk = 1 - e;
        jx = Math.sin(sec * p.jxSpeed + p.jxPhase) * p.jAmp * jk;
        jy = Math.cos(sec * p.jySpeed + p.jyPhase) * p.jAmp * jk;
      }

      var tw = 0.68 + 0.32 * Math.sin(sec * p.twSpeed + p.twPhase);
      var aH = p.alpha * tw;
      var aP = p.pa * (0.84 + 0.16 * tw);
      var a = e <= 0 ? aH : (e >= 1 ? aP : aH * (1 - e) + aP * e);
      a *= flashK;

      if (p.state === 'fly') {
        var fe = (now - p.t0 - p.delay) / p.dur;
        if (fe <= 0) {
          p.x = p.sx; p.y = p.sy;
          a *= 0.25;
        } else if (fe >= 1) {
          p.state = 'settled';
          p.x = tmp.x + jx;
          p.y = tmp.y + jy;
        } else {
          var ke = easeInOutCubic(fe);
          p.x = p.sx + (tmp.x + jx - p.sx) * ke;
          p.y = p.sy + (tmp.y + jy - p.sy) * ke;
          a *= 0.25 + 0.75 * ke;
        }
      } else if (p.state === 'settled') {
        p.x = tmp.x + jx;
        p.y = tmp.y + jy;
      } else { // escape
        p.ex += p.evx * dts;
        p.ey += p.evy * dts;
        p.evy -= 6 * dts;
        p.efade -= dt / 2400;
        p.x = p.ex;
        p.y = p.ey;
        a *= Math.max(0, p.efade);
        if (p.efade <= 0) {
          // на её место приходит новая надпись
          refreshWord(p);
          spawnFrom(p);
          p.state = 'fly';
          p.t0 = now;
          p.delay = 0;
          p.dur = rand(1400, 2200);
          p.ox = p.oy = p.ovx = p.ovy = 0;
          continue;
        }
      }

      p.x += p.ox;
      p.y += p.oy;

      if (a <= 0.01) continue;

      // до середины перехода летит целое слово, после — одиночный символ
      var sp, spw, sph;
      if (p.portOnly || e > 0.5) {
        sp = p.chSprite; spw = p.chW; sph = p.chH;
      } else {
        sp = p.sprite; spw = p.sw; sph = p.sh;
      }
      if (!sp) continue;

      ctx.globalAlpha = Math.min(1, a * 0.88);
      ctx.drawImage(sp, p.x - spw / 2, p.y - sph / 2, spw, sph);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawName(now, morph);

    requestAnimationFrame(frame);
  }

  /* ---------- старт ---------- */
  function start(e) {
    if (started) return;
    started = true;
    tapEl.classList.add('gone');
    setTimeout(function () { tapEl.style.display = 'none'; }, 800);

    initAudio();   // только здесь: созданный раньше контекст браузер заблокирует

    startTime = performance.now();
    lastFrame = 0;
    requestAnimationFrame(frame);
  }

  sndEl.addEventListener('pointerdown', function (e) {
    e.stopPropagation();   // иначе глобальный обработчик заодно дёрнет burst
    e.preventDefault();
    soundOn = !soundOn;
    paintSoundButton();
    try { window.localStorage.setItem(SOUND_STORE_KEY, soundOn ? '1' : '0'); } catch (_) {}
    if (soundOn) tone(880, 110, 0.026, 'sine', 1320, 0);
  }, { passive: false });

  faceEl.addEventListener('pointerdown', function (e) {
    e.stopPropagation();   // иначе глобальный обработчик заодно дёрнет burst
    e.preventDefault();
    toggleMorph();
  }, { passive: false });

  window.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('.ui')) return;
    if (!started) { start(e); return; }
    burst(e.clientX, e.clientY);
  }, { passive: true });

  /* ---------- ресайз / поворот ---------- */
  // Точки портрета живут в нормированных координатах, поэтому при ресайзе
  // пересчитываются только scale/cx/cy и фит портрета — фото не трогаем.
  // Счёт частиц на ресайзе НЕ пересчитывается: иначе поворот телефона
  // пересобрал бы массив частиц и порвал морф на середине.
  var layoutRaf = 0, spriteTimer = 0;
  function onResize() {
    if (layoutRaf) cancelAnimationFrame(layoutRaf);
    layoutRaf = requestAnimationFrame(function () {
      layoutRaf = 0;
      resize();
      // спрайты зависят от масштаба — перерисовываем, когда он заметно изменился
      if (DPR !== spriteDpr ||
          Math.abs(scale - spriteScale) > spriteScale * 0.02 ||
          Math.abs(portScale - spritePortScale) > spritePortScale * 0.02) {
        clearTimeout(spriteTimer);
        spriteTimer = setTimeout(buildSprites, 160);
      }
    });
  }

  resize();
  buildParticles();
  buildSprites();
  updateCounter();
  loadPortrait();

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', onResize, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) lastFrame = 0;
  });
})();
</script>
</body>
</html>
